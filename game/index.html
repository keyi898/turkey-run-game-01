<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — The Great Thanksgiving Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1503; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(120% 120% at 50% 30%, #4a2408 0%, #2b1503 70%); }
  #game { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); display: block;
          touch-action: none; cursor: pointer; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540"
    aria-label="Gobble Dash: play as a turkey escaping Thanksgiving dinner. Arrow keys or WASD to run, jump and duck, Space to jump, Shift to sprint, H to hide, P to pause."></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
